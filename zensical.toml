[project]
site_name = "gettext-tstrings"
site_description = "Safe gettext and Babel integration for Python t-strings."
site_author = "Yusuke Hayashi"
site_url = "https://gettext-tstrings.yhay81.com/"
repo_url = "https://github.com/yhay81/gettext-tstrings"
repo_name = "yhay81/gettext-tstrings"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Yusuke Hayashi &middot; MIT License"

nav = [
  { "Home" = "index.md" },
  { "Guide" = "guide.md" },
  { "Extraction" = "extraction.md" },
  { "Specification" = "spec.md" },
  { "API" = "api.md" },
]

extra_css = ["stylesheets/python.css"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# python.org's palette, defined in stylesheets/python.css. Material's built-in
# names have no entry for the logo's blue and yellow, so both schemes point at
# "custom" and take their values from there.
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Source Sans and Source Code are the faces python.org itself sets its prose and
# code in. Using them here is the whole of the visual homage — no other ornament.
[project.theme.font]
text = "Source Sans 3"
code = "Source Code Pro"

[project.theme.icon]
logo = "lucide/languages"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/yhay81/gettext-tstrings"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/gettext-tstrings/"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project]
site_name = "gettext-tstrings"
site_description = "Safe gettext and Babel integration for Python t-strings."
site_author = "Yusuke Hayashi"
site_url = "https://gettext-tstrings.yhay81.com/"
repo_url = "https://github.com/yhay81/gettext-tstrings"
repo_name = "yhay81/gettext-tstrings"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Yusuke Hayashi &middot; MIT License"

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = "tutorial.md" },
  { "Why t-strings" = "comparison.md" },
  { "Background" = "background.md" },
  { "Guide" = "guide.md" },
  { "Extraction" = "extraction.md" },
  { "In production" = "workflow.md" },
  { "How it works" = "internals.md" },
  { "Specification" = "spec.md" },
  { "API" = "api.md" },
]

extra_css = ["stylesheets/python.css"]

# No [project.markdown_extensions] table on purpose. Declaring one *replaces*
# zensical's defaults rather than adding to them, and those defaults are already
# the set these pages are written against — including pymdownx.emoji, which the
# `:material-…:` icons need.

[project.theme]
language = "en"
# overrides/main.html adds the link-preview metadata; nothing else is themed.
custom_dir = "overrides"
# The default "modern" variant gives the header a translucent page-coloured
# surface, which ignores the palette's primary colour entirely. "classic" paints
# it with that colour instead, which is what makes the python.org blue reachable
# — and a blue bar over white documentation is the vernacular of Python's own
# docs, so it reads as familiar rather than as decoration.
variant = "classic"
# Braces in the logo's yellow on the chrome's blue: what the library is about,
# at the one size a tab strip gives you.
favicon = "assets/favicon.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.preview",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# python.org's palette, defined in stylesheets/python.css. Material's built-in
# names have no entry for the logo's blue and yellow, so both schemes point at
# "custom" and take their values from there.
# A reader arrives in whichever scheme their system asks for, and the toggle
# moves them to the other one.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# python.org sets its prose in Source Sans Pro; Source Sans 3 is that face's
# current release. Its code is a Consolas stack, which is a 2008 Windows-first
# choice this has no reason to copy — Source Code Pro is the companion face to
# the text one, and reads better at documentation sizes.
[project.theme.font]
text = "Source Sans 3"
code = "Source Code Pro"

[project.theme.icon]
logo = "lucide/languages"


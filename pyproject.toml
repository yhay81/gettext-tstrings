[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gettext-tstrings"
dynamic = ["version"]
description = "Safe gettext and Babel integration for Python t-strings"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Yusuke Hayashi", email = "yusuke8h@gmail.com" },
]
keywords = ["babel", "gettext", "i18n", "internationalization", "t-strings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Internationalization",
]
dependencies = []

[project.optional-dependencies]
# 抽出とカタログ検証(pybabel)にのみ必要。実行時の描画はstdlibのgettextだけで動く。
babel = [
  "Babel>=2.18",
]

[project.urls]
Homepage = "https://github.com/yhay81/gettext-tstrings"
Issues = "https://github.com/yhay81/gettext-tstrings/issues"

[project.entry-points."babel.extractors"]
gettext_tstrings = "gettext_tstrings.extract:extract_tstrings"

[project.entry-points."babel.checkers"]
gettext_tstrings = "gettext_tstrings.checkers:check_tstring"

[dependency-groups]
dev = [
  # 抽出器とチェッカーのテストに必要(実行時の描画には不要)。
  "Babel>=2.18",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.version]
path = "src/gettext_tstrings/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gettext_tstrings"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gettext_tstrings"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["gettext_tstrings"]

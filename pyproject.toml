[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gettext-tstrings"
dynamic = ["version"]
description = "Safe gettext and Babel integration for Python t-strings"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Yusuke Hayashi", email = "yusuke8h@gmail.com" },
]
keywords = ["babel", "gettext", "i18n", "internationalization", "t-strings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Internationalization",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Needed only for extraction and catalog checking (pybabel). Runtime rendering
# works with nothing but stdlib gettext.
babel = [
  "Babel>=2.18",
]

[project.urls]
Homepage = "https://github.com/yhay81/gettext-tstrings"
Documentation = "https://gettext-tstrings.yhay81.com/"
Issues = "https://github.com/yhay81/gettext-tstrings/issues"
Changelog = "https://github.com/yhay81/gettext-tstrings/blob/main/CHANGELOG.md"
Specification = "https://github.com/yhay81/gettext-tstrings/blob/main/SPEC.md"

[project.entry-points."babel.extractors"]
gettext_tstrings = "gettext_tstrings.extract:extract_tstrings"

[project.entry-points."babel.checkers"]
gettext_tstrings = "gettext_tstrings.checkers:check_tstring"

[dependency-groups]
dev = [
  # Needed to test the extractor and the checker, not to render at runtime.
  "Babel>=2.18",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  # A second eye for the LSP violations in overrides that mypy misses. It is
  # 0.0.x, so uv.lock pins it and bumps land deliberately through dependabot.
  "ty>=0.0.64",
]
# Kept out of dev so a normal contributor setup does not pull the site
# generator; CI installs it with --group docs.
docs = [
  "zensical>=0.0.51",
]

[tool.hatch.version]
path = "src/gettext_tstrings/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gettext_tstrings"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
# The extractor warns rather than aborting, so an unexpected warning is a
# result the suite must not swallow.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["gettext_tstrings"]

[tool.coverage.report]
fail_under = 99
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Select only the groups that are already at zero in this repository, or reach zero with a
# handful of ignores. Not ALL, because a ruff preview promotion would turn CI red without
# anything here changing.
# S (bandit) stays unselected: all 194 hits in this repository are pytest asserts with zero
# true positives, and a blanket ignore would permanently hide the one real harm — asserts
# disappearing under `python -O` (S110 is already reported on the same line by SIM105).
select = [
  "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "DTZ", "E", "ERA", "EXE", "F",
  "FA", "FIX", "FLY", "FURB", "G", "I", "ICN", "INT", "LOG", "N", "PERF",
  "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET",
  "RSE", "RUF", "SIM", "SLF", "SLOT", "T10", "T20", "TD", "TID", "UP", "W",
  "YTT",
]
ignore = [
  "ANN401",  # fileobj/options are Babel's contract and interpolations are Any; narrowing lies.
  "FURB171", # A one-element in check is deliberate: it marks a set that will grow.
  "PLC0415", # Tests import locally to keep the public API surface (__all__) fixed.
  "PLR0911", # The extractor's dispatch is exactly the branch over gettext's six forms.
  "PLR0912", # Keeping the hot path flat is a measured design choice (see the top of core.py).
  "PLR0913", # Babel's options (six keyword sets) are passed straight through.
  "PLR0917", # Same as above.
  "PLR2004", # `len(args) < 3` and friends are gettext's arity itself; naming them reads worse.
  "PT018",   # Splitting only improves the failure message slightly; the intent is clear.
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["T201"]  # Measurements are reported with print.
"examples/*" = ["T201"]    # Examples show what they do with print.
"tests/*" = [
  "ARG002",  # Translations stubs must match the argument names of the public Protocol.
  "SLF001",  # Tests that inspect internal cache-limit state (_PLANS and friends) directly.
]

[tool.mypy]
python_version = "3.14"
strict = true
strict_equality_for_none = true
files = ["src", "tests", "benchmarks", "examples"]

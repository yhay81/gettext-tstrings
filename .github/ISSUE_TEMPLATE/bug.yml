name: Bug report
description: Report a reproducible defect in the runtime, extractor, checker, or documentation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. For security vulnerabilities, stop here and use the private reporting flow described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: gettext-tstrings version
      description: Paste the output of `python -c "import gettext_tstrings; print(gettext_tstrings.__version__)"`.
      placeholder: 0.1.0a5
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and Babel version when extraction is involved.
      placeholder: CPython 3.14.2, Ubuntu 24.04, Babel 2.18.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime rendering
        - Babel extraction
        - Catalog validation
        - Typing
        - Documentation
        - Packaging or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Include complete code, catalog entries, and commands needed to reproduce the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full exception, warning, or generated catalog block.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and Discussions for this problem.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Reuse CI verbatim rather than restating it: the two drifted apart before
  # (the wheel smoke lost its Windows shim on this side), and a release must
  # never be checked more loosely than a pull request.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          # checkout leaves GITHUB_TOKEN in .git/config by default, and an
          # artifact upload follows further down. Do not carry it along.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # A published artifact must not be built from a restored cache.
          enable-cache: false
      - name: Check the tag, version, and changelog agree
        run: |
          VERSION=$(grep -oE '__version__ = "[^"]+"' src/gettext_tstrings/__init__.py | cut -d'"' -f2)
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "tag $GITHUB_REF_NAME does not match __version__ $VERSION" >&2
            exit 1
          }
          grep -q "^## $VERSION " CHANGELOG.md || {
            echo "CHANGELOG.md has no released section for $VERSION" >&2
            exit 1
          }
      - run: uv build
      - name: Check the source distribution contents
        run: uv run python scripts/check_sdist.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.12.4

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oE '__version__ = "[^"]+"' src/gettext_tstrings/__init__.py | cut -d'"' -f2)
          awk -v version="$VERSION" '
            $1 == "##" && $2 == version { found = 1; next }
            found && $1 == "##" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

          # A rerun after a successful create is a no-op, not a red workflow.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          flags=()
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"

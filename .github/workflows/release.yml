name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Reuse CI verbatim rather than restating it: the two drifted apart before
  # (the wheel smoke lost its Windows shim on this side), and a release must
  # never be checked more loosely than a pull request.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          # checkout は既定で GITHUB_TOKEN を .git/config へ残す。
          # 直後に artifact を上げる経路があるので持ち越さない。
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # A published artifact must not be built from a restored cache.
          enable-cache: false
      - name: Check the tag, version, and changelog agree
        run: |
          VERSION=$(grep -oE '__version__ = "[^"]+"' src/gettext_tstrings/__init__.py | cut -d'"' -f2)
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "tag $GITHUB_REF_NAME does not match __version__ $VERSION" >&2
            exit 1
          }
          grep -q "^## $VERSION " CHANGELOG.md || {
            echo "CHANGELOG.md has no released section for $VERSION" >&2
            exit 1
          }
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.12.4

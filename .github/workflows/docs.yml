name: Documentation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publishing is not done here. Cloudflare Workers Builds watches main and runs
  # scripts/build-docs.sh itself, with a token it generates and holds, so this
  # repository stores no deployment credential at all.
  #
  # This job exists to run the same script on every pull request, because
  # Workers Builds only finds a page that will not render after the merge.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: ./scripts/build-docs.sh

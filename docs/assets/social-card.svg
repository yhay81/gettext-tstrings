<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#22303f"/>

  <!-- The logo's two colours, as the only ornament. -->
  <rect x="0" y="0" width="600" height="12" fill="#3776ab"/>
  <rect x="600" y="0" width="600" height="12" fill="#ffd43b"/>

  <text x="80" y="180" font-family="Helvetica Neue, Helvetica, Arial" font-size="76" font-weight="700" fill="#ffffff">gettext-tstrings</text>

  <text x="80" y="242" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" font-weight="400" fill="#a9bacb">Safe gettext and Babel integration for Python t-strings</text>

  <rect x="80" y="308" width="1040" height="180" rx="12" fill="#1a242f"/>
  <rect x="80" y="308" width="6" height="180" rx="3" fill="#3776ab"/>

  <text x="128" y="382" xml:space="preserve" font-family="Menlo, Monaco, Courier New, monospace" font-size="38" fill="#e6edf3">_(t<tspan fill="#a5d6a7">"Hello </tspan><tspan fill="#ffd43b">{name}</tspan><tspan fill="#a5d6a7">"</tspan>)</text>

  <text x="128" y="446" xml:space="preserve" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#8fa3b6">the catalog gets the whole sentence, and a translation cannot reshape it</text>

  <text x="80" y="562" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" font-weight="500" fill="#ffd43b">gettext-tstrings.yhay81.com</text>

